[package]
name = "gandalf-sax"
version = "4.0.0"
edition = "2021"
description = "Epic Sax Gandalf — NTP-synced infinite video loop"
authors = ["hmziqrs"]

[dependencies]
# Async runtime (for NTP)
tokio = { version = "1", features = ["full"] }

# Serialization (for mpv JSON IPC)
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
