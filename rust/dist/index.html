<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epic Sax Gandalf</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Video -->
  <div id="video-container">
    <video id="video" loop playsinline muted></video>
    <div id="unmute-hint">Click anywhere to enable audio</div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="ctrl-btn" id="mute-btn" title="Mute (M)" aria-label="Mute">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    </button>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
    <div class="controls-divider"></div>
    <button class="ctrl-btn" id="fullscreen-btn" title="Fullscreen (F)" aria-label="Enter fullscreen">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
  </div>

  <!-- Sheet Backdrop -->
  <div id="sheet-backdrop"></div>

  <!-- Settings Sheet -->
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div id="sheet-header">
      <h2 id="settings-title">Settings</h2>
      <button id="close-sheet" aria-label="Close settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div id="sheet-body">

      <!-- Sync -->
      <div class="section-card">
        <div class="section-header">Sync</div>
        <div class="sync-row">
          <div id="sync-dot"></div>
          <span id="sync-label">Waiting...</span>
        </div>
      </div>

      <!-- Playback -->
      <div class="section-card">
        <div class="section-header">Playback</div>
        <div class="segmented-group">
          <button class="seg-btn active" id="toggle-pause">Pause on Open</button>
          <button class="seg-btn" id="toggle-keep">Keep Playing</button>
        </div>
      </div>

      <!-- Theme -->
      <div class="section-card">
        <div class="section-header">Theme</div>
        <div class="segmented-group">
          <button class="seg-btn" id="theme-light" aria-label="Light theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
          <button class="seg-btn" id="theme-dark" aria-label="Dark theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
          <button class="seg-btn active" id="theme-system" aria-label="System theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></button>
        </div>
      </div>

      <!-- Links -->
      <div class="section-card">
        <div class="section-header">Links</div>
        <div class="actions-row">
          <button class="action-btn" id="btn-video"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="5 3 19 12 5 21 5 3"/></svg> Video</button>
          <button class="action-btn" id="btn-share"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Share</button>
        </div>
        <div id="share-feedback">Copied!</div>
      </div>

      <!-- Footer -->
      <div class="sheet-footer">
        <div class="footer-credit">Built by <span>hmziqrs</span></div>
        <div class="social-links">
          <a class="social-link" data-url="https://hmziq.rs" aria-label="hmziq.rs website"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
          <a class="social-link" data-url="https://hmziq.xyz" aria-label="hmziq.xyz website"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
          <a class="social-link" data-url="https://github.com/hmziqrs" aria-label="GitHub"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg></a>
          <a class="social-link text-link" data-url="https://x.com/hmziqrs" aria-label="X (Twitter)">𝕏</a>
        </div>
      </div>

    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
